<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">AKROS</title>
  <desc id="description">A compact object detector for microcontrollers, with fixed gradients, multiscale fusion, and localization-aware scoring.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f9ff"/>
      <stop offset="1" stop-color="#e9f5f4"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#d9e7f0" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f3158" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="20" fill="url(#background)"/>
  <path d="M635 0H1200V330H635Z" fill="url(#grid)" opacity="0.55"/>
  <path d="M645 330C730 223 851 231 920 147C1005 43 1090 54 1200 0" fill="none" stroke="#d4e9f0" stroke-width="54" opacity="0.55"/>

  <!-- The mark combines an A, feature edges, and a detection frame. -->
  <rect x="62" y="62" width="76" height="76" rx="20" fill="url(#mark)"/>
  <path d="M82 118L100 82L118 118M89 105H111" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 84V72H84M116 72H128V84M128 116V128H116M84 128H72V116" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

  <text x="158" y="120" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="2">AKROS</text>
  <text x="66" y="180" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">OBJECT DETECTION FOR MICROCONTROLLERS</text>
  <text x="66" y="224" fill="#39566b" font-family="Arial, Helvetica, sans-serif" font-size="23">Fixed gradients  ·  Multiscale fusion</text>
  <text x="66" y="257" fill="#39566b" font-family="Arial, Helvetica, sans-serif" font-size="23">Localization-aware scoring</text>

  <!-- A stylized input-to-detection pipeline. -->
  <g filter="url(#shadow)">
    <rect x="708" y="75" width="155" height="180" rx="20" fill="#ffffff" stroke="#bdd4e6" stroke-width="2"/>
    <rect x="731" y="99" width="109" height="108" rx="11" fill="#e8f1fb"/>
    <path d="M742 165L771 136L795 153L820 122L831 132" fill="none" stroke="#7898b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="764" cy="123" r="8" fill="#a5c2db"/>
    <text x="785" y="234" text-anchor="middle" fill="#4c6579" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">IMAGE</text>

    <rect x="907" y="54" width="230" height="222" rx="23" fill="#ffffff" stroke="#bdd4e6" stroke-width="2"/>
    <rect x="931" y="77" width="182" height="161" rx="14" fill="#e8f5f3"/>
    <path d="M946 181L975 152L997 168L1049 116L1080 150L1098 129" fill="none" stroke="#98b5b3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="967" cy="109" r="11" fill="#bddbd6"/>
    <rect x="972" y="112" width="93" height="74" rx="4" fill="none" stroke="#0d9488" stroke-width="5"/>
    <path d="M972 132V112H992M1045 112H1065V132M1065 166V186H1045M992 186H972V166" fill="none" stroke="#0d9488" stroke-width="6" stroke-linecap="round"/>
    <text x="1022" y="261" text-anchor="middle" fill="#4c6579" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">DETECTION</text>
  </g>
  <path d="M870 164H892" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
  <path d="M886 156L896 164L886 172" fill="none" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
